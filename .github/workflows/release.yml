name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: linux
            args: ""
          - platform: windows-latest
            target: windows
            args: "--bundles nsis"
          - platform: macos-latest
            target: macos
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      # 发布前先跑测试——防止带病发布（此前 MCP 沙箱 bug 因 CI 不跑测试而漏检）
      - name: Run frontend tests
        run: pnpm test

      - name: Run MCP tests
        run: cargo test -p jot-mcp

      # 构建 jot-mcp 并放入 src-tauri/binaries/，供 tauri externalBin 打包进安装包
      # Tauri 按 <名称>-<target triple> 约定查找 sidecar 二进制
      - name: Build jot-mcp (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          cargo build --release -p jot-mcp
          mkdir -p src-tauri/binaries
          cp target/release/jot-mcp src-tauri/binaries/jot-mcp-x86_64-unknown-linux-gnu

      - name: Build jot-mcp (Windows)
        if: matrix.platform == 'windows-latest'
        run: |
          cargo build --release -p jot-mcp
          mkdir -p src-tauri/binaries
          cp target/release/jot-mcp.exe src-tauri/binaries/jot-mcp-x86_64-pc-windows-msvc.exe

      - name: Build jot-mcp (macOS universal)
        if: matrix.platform == 'macos-latest'
        run: |
          cargo build --release -p jot-mcp --target aarch64-apple-darwin
          cargo build --release -p jot-mcp --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          # universal 构建会按每个架构分别 cargo build，tauri-build 在编译时
          # 校验 binaries/jot-mcp-<target-triple> 存在，因此需 per-arch 副本；
          # universal 版本供打包阶段 lipo 使用
          cp target/aarch64-apple-darwin/release/jot-mcp src-tauri/binaries/jot-mcp-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/jot-mcp src-tauri/binaries/jot-mcp-x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/jot-mcp \
            target/x86_64-apple-darwin/release/jot-mcp \
            -output src-tauri/binaries/jot-mcp-universal-apple-darwin

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.args }}

      - name: Fix .deb desktop entry (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: bash scripts/fix-deb-desktop.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.target }}
          path: |
            # 注意：项目是 workspace（根 Cargo.toml），构建产物在根 target/，
            # 而非 src-tauri/target/；macOS universal 构建在 universal-apple-darwin 目录下。
            # 不包含 *.app 目录——它是文件夹，会被 files: bundles/**/* 递归展开成
            # 一堆松散资产（Info.plist/icon.icns/二进制/资源文档），污染 release；
            # macOS 用户直接用 dmg 即可（dmg 内含 .app）。
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: bundles

      - name: List bundles
        run: ls -laR bundles/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "即记 (Jot) ${{ github.ref_name }}"
          body: "See the assets to download this version and install."
          draft: true
          prerelease: false
          files: bundles/**/*
